name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Build, typecheck & tests (TS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockiteasy
          POSTGRES_PASSWORD: stockiteasy
          POSTGRES_DB: stockiteasy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockiteasy" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://stockiteasy:stockiteasy@localhost:5432/stockiteasy_test?schema=public
      DATABASE_URL: postgresql://stockiteasy:stockiteasy@localhost:5432/stockiteasy_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Prisma client
        run: pnpm --filter @stockiteasy/api exec prisma generate
      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck
      - name: Unit tests (shared, i18n, api-client, mobile sync engine)
        run: pnpm test
      - name: API integration tests (PostgreSQL)
        run: pnpm --filter @stockiteasy/api test:e2e
      - name: API build
        run: pnpm --filter @stockiteasy/api build
      - name: Web build
        run: pnpm --filter @stockiteasy/web build
      - name: Mobile bundle (Android, Metro)
        run: pnpm --filter @stockiteasy/mobile exec expo export --platform android --output-dir dist-check
        env:
          CI: '1'

  python:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t stockiteasy-api .
      - run: docker build -f infra/docker/web.Dockerfile -t stockiteasy-web .
      - run: docker build -t stockiteasy-ai services/ai
