# Local full stack: PostgreSQL, Redis, API, web and the optional AI service.
#   cp .env.example .env && docker compose up --build
# Web: http://localhost:3000 — API docs: http://localhost:4000/api/docs
name: stockiteasy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockiteasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockiteasy}
      POSTGRES_DB: ${POSTGRES_DB:-stockiteasy}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockiteasy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  ai:
    build: ./services/ai
    ports: ["8000:8000"]

  api:
    init: true
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockiteasy}:${POSTGRES_PASSWORD:-stockiteasy}@postgres:5432/${POSTGRES_DB:-stockiteasy}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_SWAGGER: "true"
      AI_SERVICE_URL: http://ai:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-StockItEasy <no-reply@example.com>}
    ports: ["4000:4000"]

  web:
    init: true
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on: [api]
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]

volumes:
  pgdata:
